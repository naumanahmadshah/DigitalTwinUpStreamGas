# Databricks App: the FastAPI backend + single-page UI for the twin.
# The app's ONLY database is Lakebase: it reads the gold marts from their Lakebase synced copies and
# writes recommendation decisions back to Lakebase. It does not use a SQL warehouse. app.yaml (rendered
# from app.yaml.tmpl by the deploy script) supplies the Postgres schema, the Lakebase endpoint and the
# Genie space id as environment variables.
# source_code_path is relative to this file (resources/), hence ../app.
resources:
  apps:
    app:
      name: ${var.app_name}
      description: "Gas Upstream Digital Twin: Command Centre, maps, value-chain and Analytics tabs, 3D site view, impact analysis, a link to the Genie space and a human-in-the-loop recommendation inbox. Served from Lakebase."
      source_code_path: ../app
      resources:
        - name: "lakebase"
          postgres:
            branch: projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/databricks-postgres
            permission: "CAN_CONNECT_AND_CREATE"
