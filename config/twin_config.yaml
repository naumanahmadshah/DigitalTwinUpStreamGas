# ---------------------------------------------------------------------------------------------
# 3D scenes (Design 2.13 / 3.1): one navigable scene per value-chain stop. hotspot key == tag_id.
# The generator writes slv_geometry_manifest rows mapping scene_id -> tag_id -> coords/LOD.
# ---------------------------------------------------------------------------------------------
scenes:
  per_wellpad: true          # scene_{AREA}_wh for each pad
  gathering: true            # scene_GTH001
  per_cpf_train: true        # scene_{AREA} compression + process for each train
  custody: true              # scene_MET

# ---------------------------------------------------------------------------------------------
# Generation run parameters (Data-gen Part 9.8). Tag counts scaled to demo size; physics real.
# ---------------------------------------------------------------------------------------------
generation:
  backfill_days: 730         # 2 years: reservoir depletion, a seasonal weather cycle, RBI/maint clocks
  raw_window_days: 14        # short raw uncompressed window for the historian-materialization path
  gas_day_tz: "Australia/Brisbane"
  # demo-sane volumes: report-by-exception keeps the row count realistic but cheap on serverless
  deadband_pct: 1.5          # RT tags emit only when they move beyond this band
  bad_quality_fraction: 0.02 # share of records flagged bad/uncertain/sensor_out/manual_override
  missing_context_fraction: 0.05 # share of assets with missing/stale functional-location links

# ---------------------------------------------------------------------------------------------
# Scenario storylines (Data-gen 9.7). Each is a seeded, reproducible perturbation of solve().
# One injected scenario propagates to every downstream signal, event, allocation line, and dollar.
# These map straight to the Part 3 operator questions and the 3.2 Genie bank.
# ---------------------------------------------------------------------------------------------
scenarios:
  - {id: reservoir_depletion,   enabled: true,  target: "BAR007", desc: "well group pressure trends down vs plan"}
  - {id: liquid_loading_onset,  enabled: true,  target: "BAR003", desc: "a well crosses its critical rate"}
  - {id: compressor_vibration,  enabled: true,  target: "CPF002-CMP", desc: "vibration rises on a Train 2 compressor, unit becomes the field constraint"}
  - {id: dewpoint_drift,        enabled: true,  target: "CPF001", desc: "TEG/amine degrades, stream approaches spec limit"}
  - {id: emissions_event,       enabled: true,  target: "CPF001-FLR", desc: "flare/vent episode + fugitive plume"}
  - {id: deferment_event,       enabled: true,  target: "BAR005", desc: "event defers production with coded cause + dollars"}
  - {id: integrity_due,         enabled: true,  target: "CPF002", desc: "an asset's RBI clock reaches threshold"}
  - {id: unaccounted_gas,       enabled: true,  target: "MET002", desc: "metered vs allocated diverge (UAF)"}
  - {id: baseline,              enabled: true,  target: null,     desc: "null scenario: steady state within noise (consistency check)"}
