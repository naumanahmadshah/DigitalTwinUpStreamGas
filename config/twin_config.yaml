# Upstream Gas Digital Twin v2: seed configuration (the reference world, Data-gen Part 9 Layer 1).
#
# This file is the ONLY layer a new field edits: it parameterizes the whole twin. The generator
# expands it into the semantic backbone (functional locations, assets, the tag registry under
# AREA-SYSTEM-CLASS-NNNN, wells, PVT, gathering topology, 3D scenes). The medallion and the two
# surfaces (App + Genie) bind to the tag_id contract this produces.
#
# Cardinality is a national operator across all of Australia in realistic proportions: Queensland coal seam
# gas (Surat, Bowen), the Cooper, Perth and Amadeus onshore basins, and the offshore Carnarvon (North West
# Shelf), Browse, Bonaparte, Gippsland (Bass Strait) and Otway basins; 118 onshore well pads and 17 offshore
# wellhead platforms, gathering hubs and offshore manifolds, thirteen gas plants at their real towns, twelve
# custody/export points and 31 (fictional) customers. Gas is gathered and processed in the basin it is
# produced in. Tag counts are scaled to a demo-sane size while the physics stays real.

seed: 20260930            # deterministic: same seed => same field, same trips, same numbers

field:
  name: Barwon            # generic AU-style hero gas field (re-skins by swapping the seed)
  operator: Generic Upstream Operator (synthetic)
  basin: National         # every producing region in Australia, onshore and offshore
  # map anchor for the Australia map view; sites sit in their basins (see basins below)
  center_lat: -26.50
  center_lon: 134.00

# ---------------------------------------------------------------------------------------------
# Tag scheme (Design 6.1): AREA-SYSTEM-CLASS-NNNN, e.g. BAR008-WB-VL-2555. The on-asset tag IS
# the join key into slv_tag_registry and the 3D hotspot key.
# ---------------------------------------------------------------------------------------------
tag_scheme: "{area}-{system}-{class}-{nnnn:04d}"

# ISA-5.1-style class codes. measured=true emits telemetry; measured=false are physical assets
# (valves, vessels) that carry status/derived signals.
class_codes:
  PT: {name: pressure transmitter,      kind: measured, unit: kPa}
  TT: {name: temperature transmitter,   kind: measured, unit: degC}
  FT: {name: flow transmitter,          kind: measured, unit: e3m3/d}
  FE: {name: flow element / meter,      kind: measured, unit: e3m3/d}
  LT: {name: level transmitter,         kind: measured, unit: pct}
  AT: {name: analyzer / gas chromatograph, kind: measured, unit: molpct}
  VT: {name: vibration transmitter,     kind: measured, unit: mm/s}
  GD: {name: gas detector (F&G),        kind: measured, unit: pctLEL}
  ZT: {name: valve position,            kind: measured, unit: pct}
  SP: {name: speed / rotational,        kind: measured, unit: rpm}
  JT: {name: power / load,              kind: measured, unit: kW}
  VL: {name: control valve,             kind: asset}
  ESD: {name: shutdown valve (SIS/ESD), kind: asset}
  PU: {name: pump,                      kind: asset}
  CP: {name: compressor,                kind: asset}
  HX: {name: heat exchanger,            kind: asset}
  VE: {name: vessel / separator,        kind: asset}
  CL: {name: column,                    kind: asset}
  TK: {name: tank,                      kind: asset}
  GT: {name: gas turbine / genset,      kind: asset}

# ---------------------------------------------------------------------------------------------
# Systems (the SYSTEM token) grouped by value-chain stop. Each maps to a Part 2 App tab.
# ---------------------------------------------------------------------------------------------
systems:
  RES: {name: reservoir,                 stop: reservoir}
  WB:  {name: wellhead / tree,           stop: wells}
  AL:  {name: artificial lift,           stop: wells}
  GL:  {name: gathering line,            stop: gathering}
  SEP: {name: inlet separation,          stop: processing}
  CMP: {name: compression,               stop: processing}
  DEH: {name: TEG dehydration,           stop: processing}
  AMN: {name: amine / AGRU,              stop: processing}
  NGL: {name: NGL / stabilization,       stop: processing}
  UTL: {name: utilities / power,         stop: processing}
  FLR: {name: flare / vent,              stop: processing}
  MET: {name: custody metering / export, stop: custody}

# value-chain stops -> App tabs (Design 3.1). Order is the physical gas path.
value_chain_stops:
  - {code: reservoir,  tab: "Reservoir & Subsurface"}
  - {code: wells,      tab: "Wells & Artificial Lift"}
  - {code: gathering,  tab: "Gathering & Flow Assurance"}
  - {code: processing, tab: "Processing Facility / CPF"}
  - {code: custody,    tab: "Custody Transfer & Export"}

# ---------------------------------------------------------------------------------------------
# Field estate (Design Part 9.8). Areas carry the AREA token; the generator distributes wells,
# assets, and tags across them and assigns geolocations for the map + 3D scenes.
# ---------------------------------------------------------------------------------------------
# Producing basins, all of Australia in realistic proportions. Onshore basins produce from fenced well
# pads (BAR001..) tied into gathering hubs (GTH001..); offshore basins produce from wellhead platforms
# (PLT001..) tied into offshore manifold platforms (MNF001..) and a trunkline to an onshore gas plant.
# Pads are numbered basin by basin in this order; each basin's hubs take its pads round-robin.
#   pads / wells_per_pad [min, max] (seeded) / csg_fraction = share of coal seam gas (ESP-dewatered) wells
#   well_rate [min, max]  = well test potential, 10^3 m^3/d (CSG ~0.5-1.6 MMscf/d .. big offshore wells ~25 MMscf/d)
#   co2_molpct, h2s_ppm   = raw-gas composition ranges (CSG is near pure methane; Carnarvon/Browse carry CO2)
#   td_m                  = drilled depth range (CSG is shallow)
#   locations             = offshore: the real field areas the platforms stand on (cycled, with a small jitter);
#                           onshore pads scatter by `spread` degrees around the basin centre
# Sites are QLD CSG pads in the main (as in reality: thousands of low-rate wells), while a handful of
# offshore WA/NT/VIC platforms carry most of the gas (as the North West Shelf, Gorgon, Ichthys and Bass Strait do).
basins:
  - {name: Surat,           state: QLD,    reservoir: Walloon Coal Measures,   lat: -26.85, lon: 150.25, spread: 0.60, pads: 64, wells_per_pad: [2, 6], csg_fraction: 0.97, hubs: 8, well_rate: [15, 45],  co2_molpct: [0.1, 1.5], h2s_ppm: [0, 2],   td_m: [400, 1100]}
  - {name: Bowen,           state: QLD,    reservoir: Bandanna Coal Measures,  lat: -25.55, lon: 148.85, spread: 0.45, pads: 26, wells_per_pad: [2, 5], csg_fraction: 0.92, hubs: 4, well_rate: [12, 38],  co2_molpct: [0.2, 2.5], h2s_ppm: [0, 2],   td_m: [500, 1300]}
  - {name: Cooper-Eromanga, state: SA/QLD, reservoir: Patchawarra Formation,   lat: -27.95, lon: 140.45, spread: 0.70, pads: 20, wells_per_pad: [1, 3], csg_fraction: 0.0,  hubs: 3, well_rate: [8, 30],   co2_molpct: [8, 22],    h2s_ppm: [0, 20],  td_m: [2200, 3400]}
  - {name: Perth,           state: WA,     reservoir: Kingia Sandstone,        lat: -29.30, lon: 115.15, spread: 0.22, pads: 5,  wells_per_pad: [1, 3], csg_fraction: 0.0,  hubs: 1, well_rate: [30, 75], co2_molpct: [1, 6],     h2s_ppm: [0, 10],  td_m: [2800, 4200]}
  - {name: Amadeus,         state: NT,     reservoir: Pacoota Sandstone,       lat: -23.97, lon: 131.70, spread: 0.30, pads: 3,  wells_per_pad: [1, 2], csg_fraction: 0.0,  hubs: 1, well_rate: [10, 35],  co2_molpct: [1, 5],     h2s_ppm: [0, 10],  td_m: [1500, 2500]}
  - {name: Carnarvon,       state: WA,     reservoir: Mungaroo Formation,      lat: -19.90, lon: 115.30, offshore: true, pads: 7, wells_per_pad: [4, 8], csg_fraction: 0.0, hubs: 2, well_rate: [380, 820], co2_molpct: [2, 14], h2s_ppm: [0, 15], td_m: [2800, 4800],
     locations: [[-19.59, 116.14], [-19.68, 115.94], [-19.52, 116.55], [-19.72, 115.10], [-20.10, 114.70], [-20.40, 114.25], [-19.85, 114.55]]}
  - {name: Browse,          state: WA,     reservoir: Plover Formation,        lat: -13.85, lon: 123.30, offshore: true, pads: 2, wells_per_pad: [5, 8], csg_fraction: 0.0, hubs: 1, well_rate: [280, 560], co2_molpct: [6, 12], h2s_ppm: [0, 10], td_m: [3800, 5200],
     locations: [[-13.92, 123.28], [-13.78, 123.36]]}
  - {name: Bonaparte,       state: NT,     reservoir: Elang Formation,         lat: -12.30, lon: 129.40, offshore: true, pads: 2, wells_per_pad: [3, 5], csg_fraction: 0.0, hubs: 1, well_rate: [140, 320], co2_molpct: [2, 10], h2s_ppm: [0, 10], td_m: [2600, 4000],
     locations: [[-13.95, 128.55], [-10.35, 130.05]]}
  - {name: Gippsland,       state: VIC,    reservoir: Latrobe Group,           lat: -38.30, lon: 148.05, offshore: true, pads: 4, wells_per_pad: [4, 8], csg_fraction: 0.0, hubs: 1, well_rate: [35, 95], co2_molpct: [1, 3], h2s_ppm: [0, 5], td_m: [1600, 2800],
     locations: [[-38.30, 147.67], [-38.23, 148.22], [-38.20, 148.00], [-38.22, 148.58]]}
  - {name: Otway,           state: VIC,    reservoir: Waarre Formation,        lat: -38.95, lon: 142.45, offshore: true, pads: 2, wells_per_pad: [2, 4], csg_fraction: 0.0, hubs: 1, well_rate: [45, 120], co2_molpct: [1, 8], h2s_ppm: [0, 5], td_m: [1800, 3200],
     locations: [[-39.15, 142.15], [-38.82, 142.72]]}

wellpads:
  prefix: BAR              # onshore pads BAR001.. (offshore platforms PLT001..)
  gas_lift_fraction: 0.25  # of onshore conventional wells, share on gas lift (offshore gas wells flow naturally)

gathering:
  segments_per_hub: [3, 6] # gathering-line / flowline segments per hub (seeded)

cpf:
  # thirteen gas plants, each at its real town and in the basin whose gas it processes. units = the process
  # units the plant carries besides inlet separation and compression: CSG is dry, near-pure methane, so a
  # CSG plant only dehydrates; conventional and offshore gas needs CO2 removal (AMN) and condensate/NGL recovery.
  compressors_per_train: 3   # default
  trains:
    - {area: CPF001, name: Surat gas plant 1,      place: Miles,         basin: Surat,           lat: -26.66, lon: 150.18, compressors: 4, units: [DEH, UTL, FLR]}
    - {area: CPF002, name: Moomba gas plant,       place: Moomba,        basin: Cooper-Eromanga, lat: -28.11, lon: 140.21, compressors: 4, units: [DEH, AMN, NGL, UTL, FLR]}
    - {area: CPF003, name: Surat gas plant 2,      place: Chinchilla,    basin: Surat,           lat: -26.74, lon: 150.63, compressors: 4, units: [DEH, UTL, FLR]}
    - {area: CPF004, name: Surat gas plant 3,      place: Tara,          basin: Surat,           lat: -27.28, lon: 150.46, compressors: 3, units: [DEH, UTL, FLR]}
    - {area: CPF005, name: Bowen gas plant,        place: Injune,        basin: Bowen,           lat: -25.84, lon: 148.57, compressors: 3, units: [DEH, UTL, FLR]}
    - {area: CPF006, name: Karratha gas plant,     place: Karratha,      basin: Carnarvon,       lat: -20.60, lon: 116.78, compressors: 5, units: [DEH, AMN, NGL, UTL, FLR]}
    - {area: CPF007, name: Barrow Island gas plant, place: Barrow Island, basin: Carnarvon,      lat: -20.78, lon: 115.42, compressors: 4, units: [DEH, AMN, NGL, UTL, FLR]}
    - {area: CPF008, name: Darwin gas plant,       place: Darwin,        basin: Browse,          lat: -12.53, lon: 130.88, compressors: 4, units: [DEH, AMN, NGL, UTL, FLR]}
    - {area: CPF009, name: Wadeye gas plant,       place: Wadeye,        basin: Bonaparte,       lat: -14.24, lon: 129.52, compressors: 2, units: [DEH, NGL, UTL, FLR]}
    - {area: CPF010, name: Longford gas plant,     place: Longford,      basin: Gippsland,       lat: -38.20, lon: 147.17, compressors: 3, units: [DEH, AMN, NGL, UTL, FLR]}
    - {area: CPF011, name: Otway gas plant,        place: Port Campbell, basin: Otway,           lat: -38.56, lon: 142.86, compressors: 2, units: [DEH, AMN, NGL, UTL, FLR]}
    - {area: CPF012, name: Dongara gas plant,      place: Dongara,       basin: Perth,           lat: -29.40, lon: 115.12, compressors: 2, units: [DEH, AMN, UTL, FLR]}
    - {area: CPF013, name: Mereenie gas plant,     place: Mereenie,      basin: Amadeus,         lat: -23.95, lon: 131.47, compressors: 2, units: [DEH, UTL, FLR]}

custody:
