# ---------------------------------------------------------------------------------------------
# Supply network (the physical gas path, for impact analysis). Pads feed the gathering hub(s) in their
# basin; hubs feed the processing plant in their basin. Each plant's sales gas splits across custody
# meters by these shares (they sum to 1 per plant).
# ---------------------------------------------------------------------------------------------
network:
  processing_shrink: 0.03    # fuel gas + CO2/inert removal between the wellhead and the sales meter
  train_custody:
    CPF001: {MET001: 0.6, MET003: 0.4}    # Surat: domestic pipeline export + Gladstone LNG feed
    CPF002: {MET002: 0.85, MET001: 0.15}  # Cooper: Moomba interconnect + backhaul north to Wallumbilla
    CPF003: {MET003: 1.0}                 # Surat: LNG feed
    CPF004: {MET001: 0.5, MET003: 0.5}    # Surat: split between domestic export and LNG feed
    CPF005: {MET003: 1.0}                 # Bowen: LNG feed
    CPF006: {MET004: 0.85, MET006: 0.15}  # Karratha: LNG export + WA domestic gas reservation
    CPF007: {MET005: 0.88, MET006: 0.12}  # Barrow Island: LNG export + WA domestic gas
    CPF008: {MET009: 1.0}                 # Darwin: LNG export
    CPF009: {MET010: 1.0}                 # Wadeye: NT domestic gas
    CPF010: {MET007: 1.0}                 # Longford: Melbourne and the east coast
    CPF011: {MET008: 1.0}                 # Otway: Iona hub (Victoria and South Australia)
    CPF012: {MET011: 1.0}                 # Dongara: WA Mid West domestic gas
    CPF013: {MET012: 1.0}                 # Mereenie: Alice Springs and the Northern Gas Pipeline

